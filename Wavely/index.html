<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <title>Wavely — Spotify & JOOX Inspired Thai Music</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #09090e;
            --bg-side: #000000;
            --card: #12121c;
            --card-hover: #1e1e2d;
            --txt: #ffffff;
            --dim: #b3b3b3;
            --acc: #1ed760;
            --acc-glow: rgba(30, 215, 96, 0.4);
            --joox-purple: #7c5cff;
            --bar: 90px;
            --m-nav: 60px;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Noto Sans Thai', sans-serif;
            color: var(--txt);
        }

        #app {
            display: grid;
            grid-template-columns: 260px 1fr;
            grid-template-rows: 1fr var(--bar);
            height: 100vh;
            height: 100dvh;
        }

        /* Sidebar Desktop */
        aside {
            background: var(--bg-side);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            overflow-y: auto;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 20px;
            padding-left: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--acc), #00f2fe, var(--joox-purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: var(--acc);
            border-radius: 50%;
            display: grid;
            place-items: center;
            box-shadow: 0 0 15px var(--acc-glow);
        }

        .logo-icon svg { width: 16px; height: 16px; fill: #000; }

        .nav-group {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--dim);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all .25s ease;
            user-select: none;
        }

        .nav:hover { background: rgba(255, 255, 255, 0.08); color: var(--txt); transform: translateX(3px); }
        .nav.on { background: linear-gradient(90deg, rgba(30, 215, 96, 0.2), transparent); color: var(--acc); font-weight: 700; border-left: 4px solid var(--acc); }
        .nav svg { width: 22px; height: 22px; fill: currentColor; flex: none; }

        .addbtn {
            margin-top: auto;
            padding: 14px;
            border-radius: 30px;
            border: 0;
            cursor: pointer;
            background: linear-gradient(135deg, var(--acc), #10b981);
            color: #000000;
            font-weight: 800;
            font-size: 14px;
            box-shadow: 0 4px 20px var(--acc-glow);
            transition: .25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .addbtn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 8px 25px rgba(30, 215, 96, 0.5); }

        /* Main Content */
        main {
            overflow-y: auto;
            padding: 24px 36px 40px;
            background: radial-gradient(1000px 450px at 20% -10%, rgba(124, 92, 255, 0.18), transparent),
                radial-gradient(800px 400px at 80% 100%, rgba(30, 215, 96, 0.1), transparent), var(--bg);
            -webkit-overflow-scrolling: touch;
        }

        main::-webkit-scrollbar, aside::-webkit-scrollbar { width: 8px; }
        main::-webkit-scrollbar-thumb, aside::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }

        .top {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 28px;
            position: sticky;
            top: -24px;
            padding: 16px 0;
            background: linear-gradient(var(--bg) 80%, transparent);
            z-index: 6;
            backdrop-filter: blur(16px);
        }

        .search {
            flex: 1;
            min-width: 260px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            padding: 12px 22px;
            transition: .3s;
            backdrop-filter: blur(10px);
        }

        .search:focus-within {
            border-color: var(--acc);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 20px rgba(30, 215, 96, 0.25);
        }

        .search input {
            flex: 1;
            background: none;
            border: 0;
            color: var(--txt);
            font-size: 14.5px;
            outline: none;
            width: 100%;
        }

        .search input::placeholder { color: #8888a0; }

        .search svg {
            width: 20px;
            height: 20px;
            fill: var(--dim);
            flex: none;
            cursor: pointer;
            transition: .2s;
        }

        .search svg:hover { fill: var(--acc); }

        .view-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--dim);
            padding: 12px 20px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: .25s;
        }

        .view-btn:hover {
            color: var(--txt);
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        /* Hero Banner */
        .hero {
            background: linear-gradient(135deg, rgba(124, 92, 255, 0.3), rgba(30, 215, 96, 0.15)), var(--card);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .hero-vinyl {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #111;
            border: 4px solid #222;
            position: relative;
            flex: none;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
            display: grid;
            place-items: center;
            animation: spin 12s linear infinite;
            animation-play-state: paused;
        }

        .hero-vinyl.playing { animation-play-state: running; }

        .hero-vinyl img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .hero-info { flex: 1; min-width: 0; }
        .hero-tag { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--acc); text-transform: uppercase; margin-bottom: 6px; }
        .hero-info h1 { font-size: 22px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hero-info p { color: var(--dim); font-size: 14px; margin-top: 4px; }

        h2 {
            font-size: 22px;
            margin: 20px 0 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 12px;
            letter-spacing: -0.3px;
        }

        /* Grid View */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 22px;
        }

        .card {
            background: var(--card);
            border-radius: 18px;
            padding: 16px;
            cursor: pointer;
            transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card:hover {
            background: var(--card-hover);
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        .card.now {
            border-color: var(--acc);
            background: var(--card-hover);
            box-shadow: 0 0 25px rgba(30, 215, 96, 0.3);
        }

        .card .ph { position: relative; border-radius: 14px; overflow: hidden; }

        .card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            background: #1a1a26;
            display: block;
            transition: .4s;
        }

        .card:hover img { transform: scale(1.06); }

        .card b {
            display: block;
            margin: 14px 0 4px;
            font-size: 14.5px;
            line-height: 1.35;
            max-height: 2.7em;
            overflow: hidden;
            color: var(--txt);
        }

        .card small { color: var(--dim); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .tag {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 9px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            color: var(--acc);
            border: 1px solid rgba(30, 215, 96, 0.4);
        }

        .fab {
            position: absolute;
            right: 12px;
            bottom: 12px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--acc);
            display: grid;
            place-items: center;
            opacity: 0;
            transform: translateY(12px);
            transition: .3s;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
        }

        .card:hover .fab { opacity: 1; transform: translateY(0); }
        .fab svg { width: 20px; height: 20px; fill: #000000; margin-left: 2px; }

        .card-fav, .card-del {
            position: absolute;
            top: 10px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            display: grid;
            place-items: center;
            opacity: 0;
            transition: .2s;
            z-index: 2;
        }

        .card-fav { right: 10px; }
        .card-del { right: 48px; }
        .card:hover .card-fav, .card:hover .card-del { opacity: 1; }
        .card-fav svg { width: 16px; height: 16px; fill: #fff; }
        .card-fav.on svg { fill: var(--acc); }
        .card-del svg { width: 15px; height: 15px; fill: #ff4d4d; }

        /* Visualizer Wave Element */
        .card-wave, .player-wave {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            opacity: 0;
            transition: .3s;
            pointer-events: none;
        }

        .card.now .card-wave { opacity: 1; }

        .wave-bar, .p-wave-bar {
            width: 4px;
            height: 24px;
            background: var(--acc);
            border-radius: 4px;
            animation: waveAnim 0.8s infinite ease-in-out alternate;
            box-shadow: 0 0 10px var(--acc);
        }

        .wave-bar:nth-child(2), .p-wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .wave-bar:nth-child(3), .p-wave-bar:nth-child(3) { animation-delay: 0.4s; }
        .wave-bar:nth-child(4), .p-wave-bar:nth-child(4) { animation-delay: 0.6s; }

        @keyframes waveAnim {
            0% { height: 6px; }
            100% { height: 30px; }
        }

        .paused .wave-bar, .paused .p-wave-bar {
            animation-play-state: paused !important;
            height: 6px !important;
        }

        /* List View Mode */
        .list-mode {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .list-mode .card {
            display: grid;
            grid-template-columns: 56px 1fr auto;
            align-items: center;
            gap: 18px;
            padding: 12px 18px;
        }

        .list-mode .card:hover { transform: none; }
        .list-mode .card b { margin: 0; }
        .list-mode .card .tag, .list-mode .card .fab { display: none; }
        .list-mode .card-action-wrap { display: flex; gap: 10px; align-items: center; }
        .list-mode .card-fav, .list-mode .card-del { position: relative; top: 0; right: 0; opacity: 1; background: none; }

        /* Player Footer */
        footer {
            grid-column: 1/-1;
            background: rgba(10, 10, 15, 0.98);
            backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: grid;
            grid-template-columns: 1.2fr 2fr 1fr;
            align-items: center;
            padding: 0 28px;
            gap: 20px;
            z-index: 10;
        }

        .meta { display: flex; align-items: center; gap: 16px; min-width: 0; }
        .meta-img-wrap { position: relative; width: 56px; height: 56px; flex: none; }
        .meta img { width: 100%; height: 100%; border-radius: 12px; object-fit: cover; background: #20202c; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6); }

        .player-wave {
            position: relative;
            inset: auto;
            background: none;
            height: 16px;
            margin-top: 4px;
            opacity: 1;
            justify-content: flex-start;
        }

        .meta b { font-size: 14.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--txt); }
        .meta small { color: var(--dim); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

        .ctr { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .btns { display: flex; align-items: center; gap: 22px; }
        .btns button { background: none; border: 0; cursor: pointer; color: var(--dim); display: grid; place-items: center; transition: .2s; }
        .btns button:hover { color: var(--txt); transform: scale(1.15); }
        .btns button.act { color: var(--acc); text-shadow: 0 0 10px var(--acc); }
        .btns svg { width: 20px; height: 20px; fill: currentColor; }

        #pp {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--txt);
            transition: .25s;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        #pp:hover { transform: scale(1.08); background: var(--acc); box-shadow: 0 0 20px var(--acc-glow); }
        #pp svg { width: 18px; height: 18px; fill: #000000; }

        .prog { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 560px; }
        .prog span { font-size: 12px; color: var(--dim); min-width: 38px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--txt);
            transition: .1s;
        }

        input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.3); background: var(--acc); }

        .vol { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
        .vol input { max-width: 90px; }
        .vol svg { width: 20px; height: 20px; fill: var(--dim); flex: none; }

        #ytBox {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }

        /* Modal & Toast */
        .ov {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: grid;
            place-items: center;
            opacity: 0;
            pointer-events: none;
            transition: .3s;
            z-index: 80;
            padding: 18px;
        }

        .ov.on { opacity: 1; pointer-events: auto; }

        .dlg {
            background: var(--card-hover);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 28px;
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
        }

        .dlg h3 { font-size: 19px; }

        .dlg input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 14px 16px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .dlg input:focus { border-color: var(--acc); box-shadow: 0 0 15px rgba(30, 215, 96, 0.2); }
        .dlg .btns-row { display: flex; justify-content: flex-end; gap: 12px; margin-top: 6px; }

        .dlg button {
            padding: 11px 20px;
            border-radius: 12px;
            border: 0;
            cursor: pointer;
            font-weight: 700;
            font-size: 13.5px;
        }

        .btn-c { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .btn-p { background: var(--acc); color: #000; box-shadow: 0 4px 15px var(--acc-glow); }

        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            padding: 12px 26px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13.5px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transition: .3s;
            pointer-events: none;
            z-index: 99;
        }

        .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

        .loader {
            grid-column: 1/-1;
            text-align: center;
            padding: 60px 0;
            color: var(--dim);
            font-size: 15px;
        }

        .m-nav {
            display: none;
            position: fixed;
            bottom: var(--bar);
            left: 0; right: 0;
            height: var(--m-nav);
            background: rgba(6, 6, 9, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 9;
            justify-content: space-around;
            align-items: center;
        }

        .m-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--dim); font-size: 10px; cursor: pointer;
        }

        .m-item.on { color: var(--acc); font-weight: 700; }
        .m-item svg { width: 20px; height: 20px; fill: currentColor; }

        @media (max-width: 768px) {
            #app { grid-template-columns: 1fr; grid-template-rows: 1fr calc(var(--bar) + var(--m-nav)); }
            aside { display: none; }
            .m-nav { display: flex; }
            footer { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; padding: 12px 16px; gap: 10px; }
            .meta { grid-column: 1/-1; }
            .ctr { grid-column: 1/-1; width: 100%; }
            .vol { display: none; }
            .hero { display: none; }
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- Sidebar -->
        <aside>
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />
                    </svg>
                </div>
                Wavely Hub
            </div>

            <div class="nav-group">
                <div class="nav on" data-v="home">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" /></svg>
                    <span>หน้าแรก</span>
                </div>
                <div class="nav" data-v="lib">
                    <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z" /></svg>
                    <span>เพลย์ลิสต์ของฉัน</span>
                </div>
                <div class="nav" data-v="fav">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" /></svg>
                    <span>เพลงที่ถูกใจ</span>
                </div>
            </div>

            <button class="addbtn" id="btnImport">
                <span>+</span> เพิ่มเพลงจาก URL
            </button>
        </aside>

        <!-- Main View -->
        <main>
            <div class="top">
                <div class="search">
                    <svg id="btnSearch" viewBox="0 0 24 24">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                    </svg>
                    <input type="text" id="searchInput" placeholder="ค้นหาชื่อเพลง ศิลปิน บน YouTube...">
                </div>
                <button class="view-btn" id="toggleViewBtn">📋 สลับมุมมอง</button>
            </div>

            <!-- Hero Banner -->
            <div class="hero">
                <div class="hero-vinyl" id="heroVinyl">
                    <img id="heroImg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' fill='%2320202c'><rect width='48' height='48'/></svg>" alt="cover">
                </div>
                <div class="hero-info">
                    <div class="hero-tag">NOW PLAYING • YOUTUBE DIRECT</div>
                    <h1 id="heroTitle">เลือกเพลงเพื่อเริ่มฟัง</h1>
                    <p id="heroArtist">Wavely Spotify & JOOX Hub</p>
                </div>
            </div>

            <h2 id="secTitle">🇹🇭 เพลงไทยแนะนำยอดนิยม</h2>
            <div class="grid" id="mGrid"></div>
        </main>

        <!-- Player Bar -->
        <footer>
            <div class="meta">
                <div class="meta-img-wrap">
                    <img id="pImg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' fill='%2320202c'><rect width='48' height='48'/></svg>" alt="cover">
                </div>
                <div>
                    <b id="pTitle">เลือกเพลงเพื่อเริ่มฟัง</b>
                    <small id="pArtist">Wavely Thai Music Hub</small>
                    <div class="player-wave paused" id="playerWave">
                        <div class="p-wave-bar"></div>
                        <div class="p-wave-bar"></div>
                        <div class="p-wave-bar"></div>
                        <div class="p-wave-bar"></div>
                    </div>
                </div>
            </div>

            <div class="ctr">
                <div class="btns">
                    <button id="bShuf" title="สุ่ม"><svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z" /></svg></button>
                    <button id="bPrev" title="ก่อนหน้า"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" /></svg></button>
                    <button id="pp" title="เล่น/หยุด"><svg id="ppIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg></button>
                    <button id="bNext" title="ถัดไป"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" /></svg></button>
                    <button id="bRep" title="เล่นซ้ำ"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" /></svg></button>
                </div>
                <div class="prog">
                    <span id="cTime">0:00</span>
                    <input type="range" id="pSeek" min="0" max="100" value="0">
                    <span id="dTime">0:00</span>
                </div>
            </div>

            <div class="vol">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" /></svg>
                <input type="range" id="vSeek" min="0" max="100" value="80">
            </div>
        </footer>

        <!-- Mobile Nav -->
        <div class="m-nav">
            <div class="m-item on" data-v="home">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" /></svg>
                <span>หน้าแรก</span>
            </div>
            <div class="m-item" data-v="lib">
                <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z" /></svg>
                <span>เพลย์ลิสต์</span>
            </div>
            <div class="m-item" data-v="fav">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" /></svg>
                <span>ถูกใจ</span>
            </div>
        </div>

        <!-- Import Modal -->
        <div class="ov" id="ovImp">
            <div class="dlg">
                <h3>เพิ่มเพลงลงเพลย์ลิสต์</h3>
                <input type="text" id="impUrl" placeholder="วางลิงก์ YouTube เช่น https://youtu.be/...">
                <div class="btns-row">
                    <button class="btn-c" id="cImp">ยกเลิก</button>
                    <button class="btn-p" id="subImp">เพิ่มและเล่น</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Player Box -->
    <div id="ytBox"></div>

    <div class="toast" id="toast"></div>

    <script>
        /* ============ THAI MUSIC DATABASE ============ */
        var SEED_SONGS = [
            { id: '_BNmWLJRbuo', title: 'การหลบหนี', artist: 'HACKR', img: 'https://i.ytimg.com/vi/_BNmWLJRbuo/hqdefault.jpg' },
            { id: '1T84pPZJpvg', title: 'ปล่อยดาว', artist: 'FAVORITE', img: 'https://i.ytimg.com/vi/1T84pPZJpvg/hqdefault.jpg' },
            { id: '4Uf6Z7yP4r0', title: 'เศษ', artist: 'Tinn', img: 'https://i.ytimg.com/vi/4Uf6Z7yP4r0/hqdefault.jpg' },
            { id: 'OYPiXBIgvJ8', title: 'เพลงรัก', artist: 'Three Man Down', img: 'https://i.ytimg.com/vi/OYPiXBIgvJ8/hqdefault.jpg' },
            { id: 'vxHVQtJj2uQ', title: 'สาธุ (Sathu)', artist: 'ASIA7 Feat. ปลาย กนกพร', img: 'https://i.ytimg.com/vi/vxHVQtJj2uQ/hqdefault.jpg' },
            { id: '8U4HrSKu9AI', title: 'เริ่มใหม่', artist: 'Three Man Down', img: 'https://i.ytimg.com/vi/8U4HrSKu9AI/hqdefault.jpg' },
            { id: 'JBAuRoIRAs8', title: 'ถ้าเธอรักฉันจริง', artist: 'Three Man Down', img: 'https://i.ytimg.com/vi/JBAuRoIRAs8/hqdefault.jpg' },
            { id: 'ywtN9eWJRmE', title: 'ปล่อยให้เวลา', artist: 'Three Man Down', img: 'https://i.ytimg.com/vi/ywtN9eWJRmE/hqdefault.jpg' },
            { id: 'F_v_Qj6watw', title: 'รักใครไม่ไหว', artist: 'Three Man Down', img: 'https://i.ytimg.com/vi/F_v_Qj6watw/hqdefault.jpg' },
            { id: 'vsOP2UTZakQ', title: 'รักรักรักรักรักรักรัก (Talk Less)', artist: 'D GERRARD', img: 'https://i.ytimg.com/vi/vsOP2UTZakQ/hqdefault.jpg' },
            { id: '2NNPwwreJDc', title: 'ความรักกำลังก่อตัว', artist: 'นนท์ ธนนท์', img: 'https://i.ytimg.com/vi/2NNPwwreJDc/hqdefault.jpg' }
        ];

        /* ============ GLOBALS & STATE ============ */
        var $ = function (id) { return document.getElementById(id); };
        var $$ = function (sel) { return Array.from(document.querySelectorAll(sel)); };

        var cur = -1;
        var queue = [];
        var isPlay = false;
        var isShuf = false;
        var isRep = false;
        var isListView = false;
        var currentTab = 'home';
        var ytEngine = null;
        var progTimer = null;
        var mine = [];
        var favs = [];

        try {
            mine = JSON.parse(localStorage.getItem('wv_mine')) || [];
            favs = JSON.parse(localStorage.getItem('wv_favs')) || [];
        } catch (e) { }

        function toast(msg) {
            var el = $('toast');
            el.textContent = msg;
            el.classList.add('on');
            setTimeout(function () { el.classList.remove('on'); }, 2200);
        }

        /* ============ YOUTUBE NO-ADS IFRAME ENGINE ============ */
        window.onYouTubeIframeAPIReady = function () {
            ytEngine = new YT.Player('ytBox', {
                height: '1',
                width: '1',
                videoId: '_BNmWLJRbuo',
                events: {
                    'onReady': function () {
                        if (ytEngine && ytEngine.setVolume) ytEngine.setVolume(80);
                        startTimer();
                    },
                    'onStateChange': function (e) {
                        if (e.data === 0) next(); // Auto-play next
                        if (e.data === 1) {
                            isPlay = true;
                            updatePPUI();
                            startTimer();
                        }
                        if (e.data === 2) {
                            isPlay = false;
                            updatePPUI();
                        }
                    },
                    'onError': function () {
                        toast('⚠️ ไม่สามารถเล่นเพลงนี้ได้ ข้ามให้อัตโนมัติ...');
                        setTimeout(next, 1200);
                    }
                },
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'modestbranding': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'iv_load_policy': 3,
                    'fs': 0
                }
            });
        };

        /* ============ SEARCH YOUTUBE MUSIC DIRECT ============ */
        var INVIDIOUS_INSTANCES = [
            'https://inv.tux.pizza',
            'https://invidious.nerdvpn.de',
            'https://vid.puffyan.us'
        ];

        async function fetchYouTubeSearch(query) {
            $('mGrid').innerHTML = '<div class="loader">🔍 กำลังค้นหาเพลงใกล้เคียงบน YouTube...</div>';
            var searchKey = query.indexOf('เพลง') > -1 ? query : ('เพลง ' + query);

            for (var i = 0; i < INVIDIOUS_INSTANCES.length; i++) {
                try {
                    var url = INVIDIOUS_INSTANCES[i] + '/api/v1/search?q=' + encodeURIComponent(searchKey) + '&type=video';
                    var res = await fetch(url);
                    if (!res.ok) continue;
                    var data = await res.json();

                    var results = data.slice(0, 18).map(function (item) {
                        return {
                            id: item.videoId,
                            title: item.title,
                            artist: item.author || 'YouTube Artist',
                            img: 'https://i.ytimg.com/vi/' + item.videoId + '/hqdefault.jpg'
                        };
                    });

                    if (results.length > 0) return results;
                } catch (e) { }
            }

            // Fallback Local Filter
            var qLower = query.toLowerCase();
            return SEED_SONGS.filter(function(s) {
                return s.title.toLowerCase().indexOf(qLower) > -1 || s.artist.toLowerCase().indexOf(qLower) > -1;
            });
        }

        /* ============ RENDER UI GRID / LIST ============ */
        function isFav(id) {
            return favs.some(function (f) { return f.id === id; });
        }

        function toggleFav(e, song) {
            e.stopPropagation();
            var idx = favs.findIndex(function (f) { return f.id === song.id; });
            if (idx > -1) {
                favs.splice(idx, 1);
                toast('ลบออกจากเพลงที่ถูกใจแล้ว');
            } else {
                favs.push(song);
                toast('💚 เพิ่มลงในเพลงที่ถูกใจแล้ว');
            }
            localStorage.setItem('wv_favs', JSON.stringify(favs));
            render(queue);
        }

        function deleteFromMine(e, id) {
            e.stopPropagation();
            mine = mine.filter(function (m) { return m.id !== id; });
            localStorage.setItem('wv_mine', JSON.stringify(mine));
            toast('🗑️ ลบเพลงออกจากเพลย์ลิสต์แล้ว');
            render(mine, '📂 เพลย์ลิสต์ของฉัน');
        }

        function render(list, title) {
            if (title) $('secTitle').textContent = title;
            var g = $('mGrid');
            g.innerHTML = '';
            g.className = isListView ? 'list-mode' : 'grid';

            if (!list || !list.length) {
                g.innerHTML = '<div style="grid-column:1/-1; padding:40px; text-align:center; color:var(--dim)">ไม่พบรายการเพลงในส่วนนี้</div>';
                return;
            }

            queue = list;

            list.forEach(function (item, idx) {
                var isNow = (cur === idx);
                var hasFav = isFav(item.id);
                var isMineTab = (currentTab === 'lib');

                var d = document.createElement('div');
                d.className = 'card' + (isNow ? ' now' : '') + (isNow && !isPlay ? ' paused' : '');

                var actionBtnsHtml =
                    '<div class="card-fav ' + (hasFav ? 'on' : '') + '" title="ถูกใจ">' +
                    '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>' +
                    '</div>' +
                    (isMineTab ? '<div class="card-del" title="ลบออก">' +
                        '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>' +
                        '</div>' : '');

                var waveHtml =
                    '<div class="card-wave">' +
                    '<div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>' +
                    '</div>';

                d.innerHTML =
                    '<div class="ph">' +
                    '<img src="' + item.img + '" alt="cover" loading="lazy" onerror="this.src=\'data:image/svg+xml;utf8,<svg xmlns=\\\'http://www.w3.org/2000/svg\\\' width=\\\'150\\\' height=\\\'150\\\' fill=\\\'%2320202c\\\'><rect width=\\\'150\\\' height=\\\'150\\\'/></svg>\'">' +
                    '<span class="tag">HD</span>' +
                    waveHtml +
                    '<div class="fab"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>' +
                    '</div>' +
                    '<div>' +
                    '<b>' + item.title + '</b>' +
                    '<small>' + item.artist + '</small>' +
                    '</div>' +
                    '<div class="card-action-wrap">' + actionBtnsHtml + '</div>';

                var favBtn = d.querySelector('.card-fav');
                if (favBtn) favBtn.onclick = function (e) { toggleFav(e, item); };

                var delBtn = d.querySelector('.card-del');
                if (delBtn) delBtn.onclick = function (e) { deleteFromMine(e, item.id); };

                d.onclick = function () { playAt(idx); };
                g.appendChild(d);
            });
        }

        /* ============ PLAYER ACTIONS ============ */
        function playAt(idx) {
            if (idx < 0 || idx >= queue.length) return;
            cur = idx;
            var song = queue[cur];

            $('pTitle').textContent = song.title;
            $('pArtist').textContent = song.artist;
            $('pImg').src = song.img;

            $('heroTitle').textContent = song.title;
            $('heroArtist').textContent = song.artist;
            $('heroImg').src = song.img;

            render(queue);

            if (ytEngine && ytEngine.loadVideoById) {
                ytEngine.loadVideoById(song.id);
                isPlay = true;
                updatePPUI();
            }
        }

        function togglePlay() {
            if (cur === -1 && queue.length) { playAt(0); return; }
            if (!ytEngine) return;

            if (isPlay) {
                if (ytEngine.pauseVideo) ytEngine.pauseVideo();
                isPlay = false;
            } else {
                if (ytEngine.playVideo) ytEngine.playVideo();
                isPlay = true;
            }
            updatePPUI();
        }

        function updatePPUI() {
            var path = isPlay ? 'M6 19h4V5H6v14zm8-14v14h4V5h-4z' : 'M8 5v14l11-7z';
            $('ppIcon').innerHTML = '<path d="' + path + '"/>';

            var vinyl = $('heroVinyl');
            if (vinyl) {
                vinyl.classList.toggle('playing', isPlay);
            }

            var pWave = $('playerWave');
            if (pWave) {
                pWave.classList.toggle('paused', !isPlay);
            }

            $$('.card').forEach(function (c, i) {
                if (i === cur) {
                    c.classList.toggle('paused', !isPlay);
                }
            });
        }

        function next() {
            if (!queue.length) return;
            var nextIdx = cur + 1;
            if (isShuf) nextIdx = Math.floor(Math.random() * queue.length);
            if (nextIdx >= queue.length) nextIdx = 0;
            playAt(nextIdx);
        }

        function prev() {
            if (!queue.length) return;
            var prevIdx = cur - 1;
            if (prevIdx < 0) prevIdx = queue.length - 1;
            playAt(prevIdx);
        }

        function startTimer() {
            clearInterval(progTimer);
            progTimer = setInterval(function () {
                if (ytEngine && ytEngine.getCurrentTime && ytEngine.getDuration) {
                    var c = ytEngine.getCurrentTime() || 0;
                    var d = ytEngine.getDuration() || 0;

                    if (d > 0) {
                        $('pSeek').value = (c / d) * 100;
                        $('cTime').textContent = fmtTime(c);
                        $('dTime').textContent = fmtTime(d);
                    }
                }
            }, 500);
        }

        function fmtTime(s) {
            var m = Math.floor(s / 60);
            var sec = Math.floor(s % 60);
            return m + ':' + (sec < 10 ? '0' : '') + sec;
        }

        /* ============ CONTROLS & LISTENERS ============ */
        $('pp').onclick = togglePlay;
        $('bNext').onclick = next;
        $('bPrev').onclick = prev;

        $('bShuf').onclick = function () {
            isShuf = !isShuf;
            this.classList.toggle('act', isShuf);
            toast(isShuf ? '🔀 เปิดโหมดสุ่มเพลง' : '➡️ ปิดโหมดสุ่มเพลง');
        };

        $('bRep').onclick = function () {
            isRep = !isRep;
            this.classList.toggle('act', isRep);
            toast(isRep ? '🔁 เปิดโหมดเล่นซ้ำ' : '➡️ ปิดโหมดเล่นซ้ำ');
        };

        $('pSeek').oninput = function () {
            var pct = this.value;
            if (ytEngine && ytEngine.getDuration) {
                var dur = ytEngine.getDuration();
                ytEngine.seekTo((pct / 100) * dur, true);
            }
        };

        $('vSeek').oninput = function () {
            var v = this.value;
            if (ytEngine && ytEngine.setVolume) ytEngine.setVolume(v);
        };

        $('toggleViewBtn').onclick = function () {
            isListView = !isListView;
            this.textContent = isListView ? '🖼️ มุมมองการ์ด' : '📋 สลับมุมมอง';
            render(queue);
        };

        /* Search Actions */
        async function triggerSearch(q) {
            if (!q.trim()) return;
            var res = await fetchYouTubeSearch(q);
            render(res, '🔍 ผลการค้นหาสำหรับ: "' + q + '"');
        }

        $('searchInput').onkeydown = function (e) {
            if (e.key === 'Enter') triggerSearch(this.value);
        };
        $('btnSearch').onclick = function () {
            triggerSearch($('searchInput').value);
        };

        /* Modal Import */
        $('btnImport').onclick = function () { $('ovImp').classList.add('on'); };
        $('cImp').onclick = function () { $('ovImp').classList.remove('on'); };
        $('subImp').onclick = function () {
            var u = $('impUrl').value.trim();
            if (!u) return;
            var ytMatch = u.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
            if (ytMatch) {
                var yid = ytMatch[1];
                var newSong = {
                    id: yid,
                    title: 'เพลงในเพลย์ลิสต์ (' + yid + ')',
                    artist: 'Custom Import',
                    img: 'https://i.ytimg.com/vi/' + yid + '/hqdefault.jpg'
                };
                mine.unshift(newSong);
                localStorage.setItem('wv_mine', JSON.stringify(mine));
                switchTab('lib');
                $('ovImp').classList.remove('on');
                $('impUrl').value = '';
                toast('✅ เพิ่มเพลงลงเพลย์ลิสต์สำเร็จ');
                playAt(0);
            } else {
                toast('❌ รูปแบบ URL ไม่ถูกต้อง');
            }
        };

        /* Navigation Switcher */
        function switchTab(v) {
            currentTab = v;
            $$('.nav, .m-item').forEach(function (n) { n.classList.toggle('on', n.dataset.v === v); });
            if (v === 'home') render(SEED_SONGS, '🇹🇭 เพลงไทยแนะนำยอดนิยม');
            if (v === 'lib') render(mine, '📂 เพลย์ลิสต์ของฉัน');
            if (v === 'fav') render(favs, '💚 เพลงที่ถูกใจ');
        }

        $$('.nav, .m-item').forEach(function (n) {
            n.onclick = function () { if (n.dataset.v) switchTab(n.dataset.v); };
        });

        /* Keyboard Shortcuts */
        document.addEventListener('keydown', function (e) {
            if (['INPUT', 'TEXTAREA'].indexOf(e.target.tagName) > -1) return;
            if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
            if (e.code === 'ArrowRight') { e.preventDefault(); next(); }
            if (e.code === 'ArrowLeft') { e.preventDefault(); prev(); }
        });

        // Initialize App
        render(SEED_SONGS, '🇹🇭 เพลงไทยแนะนำยอดนิยม');
    </script>

    <!-- Load YouTube API -->
    <script async src="https://www.youtube.com/iframe_api"></script>
</body>

</html>
